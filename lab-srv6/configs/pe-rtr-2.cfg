hostname pe-rtr-2
!
username admin privilege 15 secret admin
ip domain name lab.local
ip ssh version 2
crypto key generate rsa modulus 2048
!
interface Ethernet0/0
 description mgmt
 ip address 172.100.210.18 255.255.255.0
 no shutdown
!
line vty 0 4
 login local
 transport input ssh
!
ip route 172.19.0.0 255.255.0.0 172.100.210.1
!
ipv6 unicast-routing
!
vrf definition CE-RTR1
 rd 65001:1
 route-target export 65001:1
 route-target import 65001:1
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 10.0.0.2 255.255.255.255
 ipv6 address 2001:DB8:FFFF::2/128
 ipv6 router isis 1
 ip router isis 1
!
interface Ethernet0/2
 description core link (IPv6 link-local only)
 no ip address
 ipv6 enable
 ipv6 router isis 1
 isis network point-to-point
 no shutdown
!
interface Ethernet0/3
 description core link (IPv6 link-local only)
 no ip address
 ipv6 enable
 ipv6 router isis 1
 isis network point-to-point
 no shutdown
!
router isis 1
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 router-id Loopback0
 !
 address-family ipv6
  multi-topology
  segment-routing srv6
   locator LOC1
  exit-address-family
!
segment-routing srv6
 encapsulation
  source-address 2001:DB8:FFFF::2
 locators
  locator LOC1
   prefix FCBB:BB00:2::/48
   format usid-f3216
!
interface Ethernet0/1
 description to CE
 vrf forwarding CE-RTR1
 ip address 10.2.2.2 255.255.255.252
 no shutdown
!
router bgp 65001
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 2001:DB8:FFFF::1 remote-as 65001
 neighbor 2001:DB8:FFFF::1 update-source Loopback0
 !
 address-family vpnv4
  neighbor 2001:DB8:FFFF::1 activate
  neighbor 2001:DB8:FFFF::1 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CE-RTR1
  neighbor 10.2.2.1 remote-as 65351
  neighbor 10.2.2.1 activate
  segment-routing srv6
   locator LOC1
   alloc-mode per-vrf
 exit-address-family
!
