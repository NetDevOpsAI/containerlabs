hostname core-p-rtr-1
!
username admin privilege 15 secret admin
ip domain name lab.local
ip ssh version 2
crypto key generate rsa modulus 2048
!
interface Ethernet0/0
 description mgmt
 ip address 172.100.210.14 255.255.255.0
 no shutdown
!
line vty 0 4
 login local
 transport input ssh
!
ip route 172.19.0.0 255.255.0.0 172.100.210.1
!
ipv6 unicast-routing
!
interface Loopback0
 ip address 10.0.0.11 255.255.255.255
 ipv6 address 2001:DB8:FFFF::11/128
 ipv6 router isis 1
 ip router isis 1
!
interface Ethernet0/1
 description core link (IPv6 link-local only)
 no ip address
 ipv6 enable
 ipv6 router isis 1
 isis network point-to-point
 no shutdown
!
interface Ethernet0/2
 description core link (IPv6 link-local only)
 no ip address
 ipv6 enable
 ipv6 router isis 1
 isis network point-to-point
 no shutdown
!
interface Ethernet0/3
 description core link (IPv6 link-local only)
 no ip address
 ipv6 enable
 ipv6 router isis 1
 isis network point-to-point
 no shutdown
!
router isis 1
 net 49.0001.0000.0000.0011.00
 is-type level-2-only
 metric-style wide
 router-id Loopback0
 !
 address-family ipv6
  multi-topology
  segment-routing srv6
   locator LOC1
  exit-address-family
!
segment-routing srv6
 encapsulation
  source-address 2001:DB8:FFFF::11
 locators
  locator LOC1
   prefix FCBB:BB00:11::/48
   format usid-f3216
!
