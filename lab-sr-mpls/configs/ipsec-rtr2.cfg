hostname ipsec-rtr2
!
username admin privilege 15 secret admin
ip domain name lab.local
ip ssh version 2
crypto key generate rsa modulus 2048
!
interface Ethernet0/0
 description mgmt
 ip address 172.100.211.19 255.255.255.0
 no shutdown
!
line vty 0 4
 login local
 transport input ssh
!
ip route 172.19.0.0 255.255.0.0 172.100.211.1
!
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
!
crypto isakmp key srmpls-lab-psk address 172.20.1.1
!
crypto ipsec transform-set TS esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile IPSEC-PROF
 set transform-set TS
!
interface Loopback100
 description TUN-SRC
 ip address 172.21.1.1 255.255.255.255
!
interface Tunnel100
 ip address 172.30.1.2 255.255.255.252
 tunnel source Loopback100
 tunnel destination 172.20.1.1
 tunnel protection ipsec profile IPSEC-PROF
 ip tcp adjust-mss 1360
!
interface Ethernet0/1
 description to PE
 ip address 10.2.2.1 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description LAN to host
 ip address 192.168.2.1 255.255.255.0
 no shutdown
!
router bgp 65351
 bgp router-id 172.21.1.1
 neighbor 10.2.2.2 remote-as 65001
 address-family ipv4
  network 172.21.1.1 mask 255.255.255.255
  neighbor 10.2.2.2 activate
!
ip route 192.168.1.0 255.255.255.0 Tunnel100
!
