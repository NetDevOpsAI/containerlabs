hostname pe-rtr-1
!
username admin privilege 15 secret admin
ip domain name lab.local
ip ssh version 2
crypto key generate rsa modulus 2048
!
interface Ethernet0/0
 description mgmt
 ip address 172.100.211.13 255.255.255.0
 no shutdown
!
line vty 0 4
 login local
 transport input ssh
!
ip route 172.19.0.0 255.255.0.0 172.100.211.1
!
vrf definition CE-RTR1
 rd 65001:1
 route-target export 65001:1
 route-target import 65001:1
 address-family ipv4
 exit-address-family
!
mpls label mode all-vrfs protocol bgp-vpnv4 per-vrf
!
interface Loopback0
 ip address 10.0.0.1 255.255.255.255
 ip router isis 1
!
interface Ethernet0/2
 description core link (unnumbered)
 ip unnumbered Loopback0
 ip router isis 1
 isis network point-to-point
 no shutdown
!
interface Ethernet0/3
 description core link (unnumbered)
 ip unnumbered Loopback0
 ip router isis 1
 isis network point-to-point
 no shutdown
!
segment-routing mpls
 connected-prefix-sid-map
  address-family ipv4
   10.0.0.1/32 index 1 range 1
  exit-address-family
!
router isis 1
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 segment-routing mpls
!
interface Ethernet0/1
 description to CE
 vrf forwarding CE-RTR1
 ip address 10.1.1.2 255.255.255.252
 no shutdown
!
router bgp 65001
 bgp router-id 10.0.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 update-source Loopback0
 !
 address-family vpnv4
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CE-RTR1
  neighbor 10.1.1.1 remote-as 65250
  neighbor 10.1.1.1 activate
 exit-address-family
!
