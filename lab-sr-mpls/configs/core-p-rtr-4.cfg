hostname core-p-rtr-4
!
username admin privilege 15 secret admin
ip domain name lab.local
ip ssh version 2
crypto key generate rsa modulus 2048
!
interface Ethernet0/0
 description mgmt
 ip address 172.100.211.17 255.255.255.0
 no shutdown
!
line vty 0 4
 login local
 transport input ssh
!
ip route 172.19.0.0 255.255.0.0 172.100.211.1
!
interface Loopback0
 ip address 10.0.0.14 255.255.255.255
 ip router isis 1
!
interface Ethernet0/1
 description core link (unnumbered)
 ip unnumbered Loopback0
 ip router isis 1
 isis network point-to-point
 no shutdown
!
interface Ethernet0/2
 description core link (unnumbered)
 ip unnumbered Loopback0
 ip router isis 1
 isis network point-to-point
 no shutdown
!
interface Ethernet0/3
 description core link (unnumbered)
 ip unnumbered Loopback0
 ip router isis 1
 isis network point-to-point
 no shutdown
!
segment-routing mpls
 connected-prefix-sid-map
  address-family ipv4
   10.0.0.14/32 index 14 range 1
  exit-address-family
!
router isis 1
 net 49.0001.0000.0000.0014.00
 is-type level-2-only
 metric-style wide
 segment-routing mpls
!
